<head>
  <script src="https://code.jquery.com/jquery-3.1.1.min.js"
    integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8="
    crossorigin="anonymous"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Lato", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #f0f0f0;
    }

    main {
      width: 100%;
      max-width: 720px;
      border-radius: 8px;
      overflow: hidden;
      background-image: linear-gradient(to top, #30cfd0 0%, #330867 100%);
      border: 2px solid #330867;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0;
      padding: 1.2rem;
      text-align: center;
      color: #fff;
      font-weight: 700;
    }

    form {
      padding: 1rem;
      background: transparent;
    }

    input {
      width: 100%;
      padding: 1rem;
      border: none;
      font-size: 1rem;
      border-radius: 4px;
    }

    .buttons {
      display: flex;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 1rem;
      border: none;
      cursor: pointer;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      font-size: 1rem;
      transition: background 0.25s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    section {
      background: #fff;
      padding: 2rem;
      text-align: center;
      min-height: 120px;
    }

    h2 {
      margin: 0;
      word-break: break-all;
    }
  </style>
</head>

<main>
  <h1>Shorten your URL here</h1>

  <form id="post-form">
      {% csrf_token %}
      <input type="text" id="link" name="link" placeholder="Enter URL here" />
      <div class="buttons">
        <button type="submit" id="shorten">Shorten</button>
      </div>
  </form>

  <section id="section">
    <h2></h2>
  </section>
</main>


<script>
  $(document).on("submit", "#post-form", function (e) {
    e.preventDefault();

    const urlInput = $("#link").val();
    const csrf = $("input[name=csrfmiddlewaretoken]").val();
    const resultBox = $("h2");

    $.ajax({
      type: "POST",
      url: "/create",
      data: {
        link: urlInput,
        csrfmiddlewaretoken: csrf
      },

      success: function (data) {
        if (data.error) {
          resultBox.html("Invalid URL: " + data.error[0]);
        } else {
          resultBox.html("www.surls.ga/" + data);
        }
      },

      error: function () {
        resultBox.html("Input a valid URL");
      }
    });
  });
</script>
